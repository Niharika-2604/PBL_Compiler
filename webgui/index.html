<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-Assisted Code Optimizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container">
        <h1>AI-Assisted Code Optimizer</h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="error">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('index') }}" enctype="multipart/form-data">
            <label for="code">Enter Python code to optimize:</label><br />
            <textarea id="code" name="code" rows="15" cols="80" placeholder="Paste your Python code here...">{{ request.form.code or '' }}</textarea><br />
            <label for="file">Or upload a Python (.py) file:</label><br />
            <input type="file" id="file" name="file" accept=".py" /><br /><br />
            <button type="submit">Optimize Code</button>
        </form>
    </div>
</body>
</html>
